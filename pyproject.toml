[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhex"
version = "0.1.0"
description = "Hypothesis-driven, evidence-guided evolution of agent skills (SkillHEX, arXiv:2608.05628) for SKILL.md hosts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["skillhex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
