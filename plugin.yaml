name: skillhex
version: 0.2.0
manifest_version: 2
api_version: 1
description: "Evidence-gated skill evolution (SkillHEX, arXiv:2608.05628): captures skill-guided turns, tests failure hypotheses, searches over skill rewrites in throwaway profiles, applies only what the evidence supports. Automatic, logged, reversible."
author: "Ross Fisher (@zorrobyte), Claude"
license: MIT
homepage: https://github.com/zorrobyte/skillhex
tags: [skills, self-improvement, evaluation, background]
requires_hermes: ">=0.21"
provides_hooks:
  - on_skill_lifecycle
  - post_tool_call
  - pre_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_end
provides_tools:
  - skillhex
config_schema:
  auto_evolve:
    type: bool
    default: true
    description: "Start an evolution run in the background after a skill-guided turn is judged to have failed."
  replay_mode:
    type: str
    default: permissive
    description: "Cassette replay policy for evaluation attempts: permissive (unmatched calls run live) or strict (blocked)."
  classify_followups:
    type: bool
    default: true
    description: "Use the host model to judge whether the user's next message says the previous skill-guided answer failed."
  min_score_to_apply:
    type: float
    default: 0.8
    description: "Without a checker, a candidate must reach this evidence score (and beat the original) before it is applied."
  budget:
    type: int
    default: 5
    description: "Evaluation attempts per evolution run (the paper's K). Each attempt is one fresh-profile run of the task."
  auto_rollback:
    type: bool
    default: true
    description: "Roll a patched skill back to its previous version when a banked hard test fails on reuse and the user then says the answer was wrong."
  bank_min_similarity:
    type: float
    default: 0.5
    description: "How similar a new task prompt must be (0..1) to a task the skill's regression tests were written for, before those tests re-run."
  snapshot_max_bytes:
    type: int
    default: 52428800
    description: "Skip the working-directory snapshot (taken when a skill loads, so evaluation starts from the pre-attempt state) above this size."
  apply_to_user_skills:
    type: bool
    default: false
    description: "Also rewrite skills Hermes treats as user-owned (not created by the agent, `hermes curator adopt` not run). Default: stage those for /skills approve instead."
  changes_window_days:
    type: float
    default: 7
    description: "How many days of skillhex changes the agent is told about at session start (so it can explain or undo them)."
